name: Graveyard Shift frontend

on:
  pull_request:
    paths:
      - 'apps/graveyard-shift/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/graveyard-shift-ci.yml'
  push:
    branches:
      - graveyard-shift-development
    paths:
      - 'apps/graveyard-shift/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/graveyard-shift-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Graveyard Shift
        run: pnpm --filter graveyard-shift build
